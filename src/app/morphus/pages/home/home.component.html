<mps-page>
  <ng-template #header>
    <mps-header type="list" [title]="'Translate'" titleIcon="apartment" (backClick)="back()" (newEntityClick)="newEntity()"></mps-header>
  </ng-template>
  <ng-template #content>
    <div class="flex flex-col justify-center items-center h-full w-full">
      <button mat-fab class="teste h-10! w-25!" (click)="butonClique()">Acionar</button>
    </div>
  </ng-template>
  <ng-template #footer></ng-template>
</mps-page>
